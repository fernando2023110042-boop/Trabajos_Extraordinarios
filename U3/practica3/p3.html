<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas Con Bootstrap-Vue</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  <style>
    .terminada {
      color: gray;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div id="app" class="container mt-4">
    <div class="jumbotron">
      <titulo></titulo>

      <!-- Fila dividida en dos mitades de 6 columnas (1 columna en pantallas estrechas) -->
      <div class="row mt-4">
        <div class="col-12 col-md-6 mb-4 mb-md-0">
          <agregar-tarea></agregar-tarea>
        </div>

        <div class="col-12 col-md-6">
          <lista-tareas></lista-tareas>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>

  <script>
    var data = {
      tareas: [
        { texto: "Aprender VueJS", terminada: false },
        { texto: "Aprender AngularJS", terminada: false },
        { texto: "Aprender ReactJS", terminada: false }
      ],
      nuevaTarea: ''
    };

    Vue.component('lista-tareas', {
      template: `
        <div>
          <h5>Tareas pendientes</h5>
          <ul class="list-group">
            <li
              v-for="(item, index) in tareas"
              :key="index"
              class="list-group-item d-flex justify-content-between align-items-center"
              :class="{ terminada: tareas[index].terminada }"
            >
              <span>{{ item.texto }}</span>
              <div>
                <button @click="modificar(index)" type="button" class="btn btn-success btn-sm mr-1">
                  <span class="material-icons" style="font-size: 16px; vertical-align: middle;">done</span>
                </button>
                <button @click="eliminar(index)" type="button" class="btn btn-danger btn-sm">
                  <span class="material-icons" style="font-size: 16px; vertical-align: middle;">clear</span>
                </button>
              </div>
            </li>
          </ul>
        </div>
      `,
      data() {
        return data;
      },
      methods: {
        modificar(index) {
          this.tareas[index].terminada = !this.tareas[index].terminada;
        },
        eliminar(index) {
          this.tareas.splice(index, 1);
        }
      }
    });

    Vue.component('agregar-tarea', {
      template: `
        <div>
          <h5>Nueva tarea</h5>
          <div class="input-group">
            <input
              class="form-control"
              type="text"
              placeholder="Ingresa una nueva tarea"
              v-model="nuevaTarea"
              @keyup.enter="agregar"
            >
            <div class="input-group-append">
              <button type="button" class="btn btn-primary" @click="agregar">Agregar</button>
            </div>
          </div>
        </div>
      `,
      data() {
        return data;
      },
      methods: {
        agregar() {
          let tareaAux = this.nuevaTarea.trim();
          if (tareaAux) {
            this.tareas.push({ texto: tareaAux, terminada: false });
            this.nuevaTarea = '';
          } else {
            alert("Debe agregar una tarea");
          }
        }
      }
    });

    Vue.component('titulo', {
      template: `
        <div>
          <h1 v-text="titulo" class="text-center"></h1>
        </div>
      `,
      data() {
        return {
          titulo: "Lista de Tareas"
        };
      }
    });

    var app = new Vue({
      el: '#app',
      data() {
        return data;
      }
    });
  </script>
</body>
</html>
